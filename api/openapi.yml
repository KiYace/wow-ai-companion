openapi: 3.1.0

info:
  title: Azeroth Companion API
  version: 0.1.0
  description: API для взаимодействия World of Warcraft Addon с AI-компаньоном.

paths:
  /events:
    post:
      summary: Передать игровое событие
      operationId: sendGameEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameEvent'
      responses:
        '202':
          description: Событие принято
        '400':
          description: Некорректное событие

components:
  schemas:

    GameEvent:
      oneOf:
        - $ref: '#/components/schemas/PlayerReadyEvent'
        - $ref: '#/components/schemas/LocationChangedEvent'
        - $ref: '#/components/schemas/TargetChangedEvent'
        - $ref: '#/components/schemas/CombatStartedEvent'
        - $ref: '#/components/schemas/CombatEndedEvent'
      discriminator:
        propertyName: type

    PlayerReadyEvent:
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          const: player_ready
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/PlayerReadyData'

    PlayerReadyData:
      type: object
      required:
        - name
        - level
        - class
        - race
        - faction
        - zone
      properties:
        name:
          type: string
        level:
          type: integer
        class:
          type: string
        race:
          type: string
        faction:
          type: string
        zone:
          type: string

    LocationChangedEvent:
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          const: location_changed
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/LocationChangedData'

    LocationChangedData:
      type: object
      required:
        - zone
      properties:
        zone:
          type: string

    TargetChangedEvent:
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          const: target_changed
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/TargetChangedData'

    TargetChangedData:
      type: object
      required:
        - name
        - level
        - type
        - hostile
      properties:
        name:
          type: string
        level:
          type: integer
        type:
          type: string
          enum:
            - player
            - creature
            - npc
        hostile:
          type: boolean

    CombatStartedEvent:
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          const: combat_started
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/CombatStartedData'

    CombatStartedData:
      type: object
      required:
        - target
      properties:
        target:
          $ref: '#/components/schemas/Target'

    Target:
      type: object
      required:
        - name
        - level
        - type
        - hostile
      properties:
        name:
          type: string
        level:
          type: integer
        type:
          type: string
          enum:
            - player
            - creature
            - npc
        hostile:
          type: boolean

    CombatEndedEvent:
      type: object
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          const: combat_ended
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/CombatEndedData'

    CombatEndedData:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - victory
            - defeat
            - escaped
            - unknown